name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.24"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 архива gitleaks_8.30.1_linux_x64.tar.gz — из gitleaks_8.30.1_checksums.txt релиза
  # v8.30.1 (2026-10-13). Меняется вместе с версией: scripts/ci/install-gitleaks.sh сверяет архив
  # именно с этим значением, а не с checksums.txt, скачанным рядом с архивом.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: scripts/check.sh --only lint

  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install gitleaks
        run: scripts/ci/install-gitleaks.sh
      - run: uv sync --frozen
      - run: scripts/check.sh --only hooks

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: scripts/check.sh --only test
        env:
          # Тест с реальным ffprobe падает, а не пропускается, если ffmpeg нет (tests/ffmpeg_gate.py).
          REQUIRE_FFMPEG: "1"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: scripts/ci/install-gitleaks.sh
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml
