[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram-бот для загрузки медиа из Instagram и YouTube Shorts"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Только Python: иначе `ruff format` переформатирует блоки кода в Markdown (docs/spec.md).
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "BLE"]
# Комментарии и docstring на русском: «с», «ТЗ» ruff принимает за латиницу.
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Дымовые тесты (реальная сеть, cookies) — вручную: uv run pytest -m smoke.
addopts = "-m 'not smoke'"
markers = ["smoke: дымовые тесты загрузчиков на реальных ссылках; вручную, не в CI"]
